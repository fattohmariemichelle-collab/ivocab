name: Temporary NQ V11b robustness audit
on:
  push:
    branches: [tmp-nq-v11-robustness-20260828]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v11b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Download primary public NQ dataset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data_v8
          curl -L --retry 3 --fail 'https://www.kaggle.com/api/v1/datasets/download/tgtanalytics/nq-futures-1min-bar-2022-2025' -o data_v8/nq.zip
          unzip -o data_v8/nq.zip -d data_v8
          test -f data_v8/Dataset_NQ_1min_2022_2025.csv
      - name: Run V11b audit
        shell: bash
        run: |
          set -o pipefail
          rm -rf trend_backtest_v11b_results trend_backtest_v11b_stdout.txt
          python tmp_backtests/nq_v11b_event_sampling.py | tee trend_backtest_v11b_stdout.txt
      - name: Upload V11b results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nq-robustness-audit-v11b-results
          path: |
            trend_backtest_v11b_results/
            trend_backtest_v11b_stdout.txt
          if-no-files-found: error
          retention-days: 7
