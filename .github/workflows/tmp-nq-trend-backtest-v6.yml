name: Temporary NQ trend detector backtest v6

on:
  push:
    branches:
      - tmp-nq-trend-backtest-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy scikit-learn

      - name: Run blind trend-regime predictability test
        shell: bash
        run: |
          set -o pipefail
          rm -rf trend_backtest_v6_results trend_backtest_v6_stdout.txt
          python tmp_backtests/nq_trend_detector_v6.py | tee trend_backtest_v6_stdout.txt

      - name: Upload detailed V6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nq-trend-backtest-v6-results
          path: |
            trend_backtest_v6_results/
            trend_backtest_v6_stdout.txt
          if-no-files-found: error
          retention-days: 7
