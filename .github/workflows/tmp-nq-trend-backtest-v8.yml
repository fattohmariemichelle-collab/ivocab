name: Temporary NQ trend detector backtest v8 real data

on:
  push:
    branches:
      - tmp-nq-trend-backtest-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v8:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Download public Kaggle NQ dataset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data_v8
          curl -L --retry 3 --fail 'https://www.kaggle.com/api/v1/datasets/download/tgtanalytics/nq-futures-1min-bar-2022-2025' -o data_v8/nq.zip
          unzip -o data_v8/nq.zip -d data_v8
          find data_v8 -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -f data_v8/Dataset_NQ_1min_2022_2025.csv
      - name: Run V8
        shell: bash
        run: |
          set -o pipefail
          rm -rf trend_backtest_v8_results trend_backtest_v8_stdout.txt
          python tmp_backtests/nq_trend_detector_v8_real_nq.py | tee trend_backtest_v8_stdout.txt
      - name: Upload V8 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nq-trend-backtest-v8-real-results
          path: |
            trend_backtest_v8_results/
            trend_backtest_v8_stdout.txt
          if-no-files-found: error
          retention-days: 7
