name: Temporary NQ trend detector backtest v2

on:
  push:
    branches:
      - tmp-nq-trend-backtest-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy

      - name: Run trend-only backtest
        shell: bash
        run: |
          set -o pipefail
          rm -rf trend_backtest_results trend_backtest_stdout.txt
          python tmp_backtests/nq_trend_detector_backtest.py | tee trend_backtest_stdout.txt

      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nq-trend-backtest-results-v2
          path: |
            trend_backtest_results/
            trend_backtest_stdout.txt
          if-no-files-found: error
          retention-days: 7
