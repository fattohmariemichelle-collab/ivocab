const TIMES = [];
for (let h = 0; h < 24; h++) {
  for (let m = 0; m < 60; m += 30) {
    TIMES.push(`${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`);
  }
}

const DAYS_SHORT = ["LU", "MA", "ME", "JE", "VE", "SA", "DI"];
const MONTHS_FR = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const DAYS_FR = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const MONTHS_SHORT = ["jan.","fév.","mars","avr.","mai","juin","juil.","août","sep.","oct.","nov.","déc."];

function formatDate(date) {
  if (!date) return null;
  return `${DAYS_FR[date.getDay()]} ${date.getDate()} ${MONTHS_SHORT[date.getMonth()]}`;
}
function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function getFirstDay(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }

// ─── CALENDAR ────────────────────────────────────────────────────────────────

function CalendarDropdown({ startDate, endDate, onSelect }) {
  const today = new Date();
  const [vy, setVy] = useState(today.getFullYear());
  const [vm, setVm] = useState(today.getMonth());
  const [hovered, setHovered] = useState(null);

  const nm = vm === 11 ? 0 : vm + 1;
  const ny = vm === 11 ? vy + 1 : vy;

  function cells(y, m) {
    const arr = [];
    for (let i = 0; i < getFirstDay(y, m); i++) arr.push(null);
    for (let d = 1; d <= getDaysInMonth(y, m); d++) arr.push(new Date(y, m, d));
    return arr;
  }

  function isPast(d) { if (!d) return false; const t = new Date(); t.setHours(0,0,0,0); return d < t; }
  function isSel(d) { if (!d) return false; return (startDate && d.toDateString() === startDate.toDateString()) || (endDate && d.toDateString() === endDate.toDateString()); }
  function isRange(d) {
    if (!d) return false;
    const s = startDate, e = endDate || hovered;
    if (!s || !e) return false;
    const [fr, to] = s <= e ? [s, e] : [e, s];
    return d > fr && d < to;
  }
  function isStart(d) { return d && startDate && d.toDateString() === startDate.toDateString(); }
  function isEnd(d) { return d && endDate && d.toDateString() === endDate.toDateString(); }

  function renderGrid(y, m) {
    return cells(y, m).map((d, i) => {
      const past = isPast(d);
      const sel = isSel(d);
      const range = isRange(d);
      const start = isStart(d);
      const end = isEnd(d);
      return (
        <div key={i}
          onMouseEnter={() => d && !past && setHovered(d)}
          onMouseLeave={() => setHovered(null)}
          onClick={() => !past && d && onSelect(d)}
          style={{
            textAlign: "center", padding: "8px 0", fontSize: 13,
            cursor: d && !past ? "pointer" : "default",
            borderRadius: sel ? "50%" : range ? 0 : 4,
            background: sel ? "#1a1a1a" : range ? "#f0f0f0" : "transparent",
            color: !d ? "transparent" : past ? "#d0d0d0" : sel ? "#fff" : "#1a1a1a",
            fontWeight: sel ? 700 : 400,
          }}
        >{d ? d.getDate() : ""}</div>
      );
    });
  }

  return (
    <div style={{
      position: "absolute", top: "calc(100% + 8px)", left: "50%", transform: "translateX(-50%)",
      background: "#fff", borderRadius: 16, boxShadow: "0 12px 48px rgba(0,0,0,0.15)",
      padding: 24, display: "flex", gap: 32, zIndex: 200, minWidth: 580,
    }}>
      {[{y: vy, m: vm}, {y: ny, m: nm}].map(({y, m}, mi) => (
        <div key={mi} style={{ flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
            {mi === 0 ? (
              <button onClick={() => vm === 0 ? (setVm(11), setVy(y => y-1)) : setVm(m => m-1)}
                style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, color: "#555", padding: "2px 6px" }}>‹</button>
            ) : <span />}
            <span style={{ fontWeight: 600, fontSize: 13 }}>{MONTHS_FR[m]} {y}</span>
            {mi === 1 ? (
              <button onClick={() => vm === 11 ? (setVm(0), setVy(y => y+1)) : setVm(m => m+1)}
                style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, color: "#555", padding: "2px 6px" }}>›</button>
            ) : <span />}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 1 }}>
            {DAYS_SHORT.map(d => (
              <div key={d} style={{ textAlign: "center", fontSize: 10, color: "#aaa", fontWeight: 700, paddingBottom: 6 }}>{d}</div>
            ))}
            {renderGrid(y, m)}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── TIME DROPDOWN ────────────────────────────────────────────────────────────

function TimeDropdown({ value, onChange, minTime }) {
  const ref = useRef(null);
  const list = minTime ? TIMES.filter(t => t > minTime) : TIMES;
  useEffect(() => {
    if (ref.current && value) {
      const idx = list.indexOf(value);
      if (idx > 1) ref.current.scrollTop = (idx - 2) * 40;
    }
  }, []);
  return (
    <div ref={ref} style={{
      position: "absolute", top: "calc(100% + 6px)", left: 0,
      background: "#fff", borderRadius: 12, boxShadow: "0 8px 32px rgba(0,0,0,0.12)",
      width: 110, maxHeight: 260, overflowY: "auto", zIndex: 300,
    }}>
      {list.map(t => (
        <div key={t} onClick={() => onChange(t)} style={{
          padding: "10px 18px", cursor: "pointer", fontSize: 14,
          fontWeight: value === t ? 700 : 400,
          background: value === t ? "#f5f5f5" : "transparent",
        }}
          onMouseEnter={e => e.currentTarget.style.background = "#f9f9f9"}
          onMouseLeave={e => e.currentTarget.style.background = value === t ? "#f5f5f5" : "transparent"}
        >{t}</div>
      ))}
    </div>
  );
}

// ─── SEARCH BAR (reusable) ────────────────────────────────────────────────────

function SearchBar({ compact = false, initialAddress = "", initialStartDate = null, initialEndDate = null, initialStartTime = null, initialEndTime = null, onSearch }) {
  const [address, setAddress] = useState(initialAddress);
  const [suggestions, setSuggestions] = useState([]);
  const [showSug, setShowSug] = useState(false);
  const [startDate, setStartDate] = useState(initialStartDate);
  const [endDate, setEndDate] = useState(initialEndDate);
  const [startTime, setStartTime] = useState(initialStartTime);
  const [endTime, setEndTime] = useState(initialEndTime);
  const [showCal, setShowCal] = useState(false);
  const [calStep, setCalStep] = useState(0);
  const [showST, setShowST] = useState(false);
  const [showET, setShowET] = useState(false);

  const addrRef = useRef(null);
  const calRef = useRef(null);
  const stRef = useRef(null);
  const etRef = useRef(null);

  useEffect(() => {
    function handle(e) {
      if (addrRef.current && !addrRef.current.contains(e.target)) setShowSug(false);
      if (calRef.current && !calRef.current.contains(e.target)) setShowCal(false);
      if (stRef.current && !stRef.current.contains(e.target)) setShowST(false);
      if (etRef.current && !etRef.current.contains(e.target)) setShowET(false);
    }
    document.addEventListener("mousedown", handle);
    return () => document.removeEventListener("mousedown", handle);
  }, []);

  function handleAddr(v) {
    setAddress(v);
    if (!v.trim()) { setSuggestions([]); setShowSug(true); return; }
    setSuggestions(SUGGESTED_PLACES.filter(p => p.toLowerCase().includes(v.toLowerCase())).slice(0, 6));
    setShowSug(true);
  }

  function openCal() { setShowCal(true); setCalStep(startDate ? 1 : 0); setShowST(false); setShowET(false); setShowSug(false); }

  function handleCalSel(d) {
    if (calStep === 0 || !startDate) {
      setStartDate(d); setEndDate(null); setCalStep(1);
    } else {
      if (d >= startDate) { setEndDate(d); setShowCal(false); setCalStep(0); setTimeout(() => setShowST(true), 100); }
      else { setStartDate(d); setEndDate(null); }
    }
  }

  function doSearch() {
    if (!address || !startDate || !endDate || !startTime || !endTime) return;
    onSearch && onSearch({ address, startDate, endDate, startTime, endTime });
  }

  const h = compact ? 44 : 52;
  const br = compact ? 10 : 12;
  const fs = compact ? 13 : 14;

  const field = (active) => ({
    display: "flex", alignItems: "center", gap: 7, padding: "0 14px",
    height: h, borderRadius: br, flex: 1,
    background: active ? "#f4f4f4" : "#f8f8f8",
    border: `1.5px solid ${active ? "#1a1a1a" : "#ebebeb"}`,
    cursor: "pointer", position: "relative", minWidth: 0, transition: "border-color 0.15s",
  });

  const inputS = { border: "none", outline: "none", background: "transparent", fontSize: fs, color: "#1a1a1a", width: "100%", cursor: "text" };

  return (
    <div style={{
      background: "#fff", borderRadius: compact ? 14 : 18, padding: compact ? 8 : 10,
      boxShadow: compact ? "0 2px 16px rgba(0,0,0,0.08)" : "0 20px 60px rgba(0,0,0,0.3)",
      display: "flex", gap: 6, alignItems: "center", width: "100%",
    }}>
      {/* Address */}
      <div ref={addrRef} style={{ ...field(showSug), flex: 2.5, position: "relative" }}>
        <PinIcon />
        <input style={{ ...inputS, flex: 1 }} placeholder="Adresse de départ et de retour"
          value={address} onChange={e => handleAddr(e.target.value)}
          onFocus={() => { if(address.trim().length > 0) setShowSug(true); setShowCal(false); setShowST(false); setShowET(false); }} />
        {showSug && (
          <div style={{
            position: "absolute", top: "calc(100% + 6px)", left: 0,
            background: "#fff", borderRadius: 12, boxShadow: "0 8px 32px rgba(0,0,0,0.12)",
            minWidth: 320, zIndex: 200, overflow: "hidden", padding: "6px 0",
          }}>
            {address.trim().length > 0 && suggestions.length > 0 && (
              <>
                <div style={{ padding: "7px 14px 3px", fontSize: 10, color: "#bbb", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1 }}>Résultats de recherche</div>
                {suggestions.map((s, i) => (
                  <div key={i} onClick={() => { setAddress(s); setShowSug(false); }}
                    style={{ padding: "9px 14px", cursor: "pointer", fontSize: 13, color: "#333", display: "flex", alignItems: "center", gap: 10 }}
                    onMouseEnter={e => e.currentTarget.style.background = "#f5f5f5"}
                    onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                    <PinIcon small /> {s}
                  </div>
                ))}
              </>
            )}
          </div>
        )}
      </div>

      {/* Start date */}
      <div style={{ display: "flex", gap: 4, position: "relative" }} ref={calRef}>
        <div onClick={openCal} style={{ ...field(showCal), minWidth: compact ? 110 : 130 }}>
          <CalIcon />
          <span style={{ fontSize: fs, color: startDate ? "#1a1a1a" : "#aaa", whiteSpace: "nowrap" }}>
            {startDate ? formatDate(startDate) : "Date de départ"}
          </span>
        </div>
        {startDate && (
          <div ref={stRef} style={{ position: "relative" }}>
            <div onClick={() => { setShowST(v => !v); setShowET(false); setShowCal(false); }}
              style={{ ...field(showST), minWidth: compact ? 68 : 80, justifyContent: "center" }}>
              <span style={{ fontSize: fs, color: startTime ? "#1a1a1a" : "#aaa", fontWeight: startTime ? 600 : 400 }}>
                {startTime || "Heure"}
              </span>
            </div>
            {showST && <TimeDropdown value={startTime} onChange={t => { setStartTime(t); setShowST(false); if (!endDate) openCal(); }} />}
          </div>
        )}
        {showCal && <CalendarDropdown startDate={startDate} endDate={endDate} onSelect={handleCalSel} />}
      </div>

      {/* End date */}
      <div style={{ display: "flex", gap: 4 }}>
        <div onClick={openCal} style={{ ...field(false), minWidth: compact ? 110 : 130, cursor: "pointer" }}>
          <CalIcon />
          <span style={{ fontSize: fs, color: endDate ? "#1a1a1a" : "#aaa", whiteSpace: "nowrap" }}>
            {endDate ? formatDate(endDate) : "Date de retour"}
          </span>
        </div>
        {endDate && (
          <div ref={etRef} style={{ position: "relative" }}>
            <div onClick={() => { setShowET(v => !v); setShowST(false); setShowCal(false); }}
              style={{ ...field(showET), minWidth: compact ? 68 : 80, justifyContent: "center" }}>
              <span style={{ fontSize: fs, color: endTime ? "#1a1a1a" : "#aaa", fontWeight: endTime ? 600 : 400 }}>
                {endTime || "Heure"}
              </span>
            </div>
            {showET && <TimeDropdown value={endTime} onChange={t => { setEndTime(t); setShowET(false); }}
              minTime={startDate && endDate && startDate.toDateString() === endDate.toDateString() ? startTime : null} />}
          </div>
        )}
      </div>

      {/* Search btn */}
      <button onClick={doSearch}
        style={{
          width: h, height: h, borderRadius: br, background: "#1a1a1a",
          border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
        }}
        onMouseEnter={e => e.currentTarget.style.background = "#333"}
        onMouseLeave={e => e.currentTarget.style.background = "#1a1a1a"}>
        <SearchIcon />
      </button>
    </div>
  );
}

// ─── PAYMENT PAGE ─────────────────────────────────────────────────────────────

function PaymentPage({ booking, car, options, protection, onBack }) {
  const [promo, setPromo] = useState("");
  const [showPromo, setShowPromo] = useState(false);
  const [agreed, setAgreed] = useState(false);
  const [showCardModal, setShowCardModal] = useState(false);
  const [savedCard, setSavedCard] = useState(null);
  const [cardForm, setCardForm] = useState({ title: "", name: "", number: "", expiry: "", cvc: "", country: "France" });

  const totalOptions = options ? options.kmExtra + (options.flexCancel ? 7.99 : 0) + (options.guaranteed ? 9 : 0) : 0;
  const protectionCost = protection === "Basic" ? 2.5 : protection === "Plus" ? 18 : protection === "Premium" ? 27 : 0;
  const total = (car ? car.priceDay : 0) + totalOptions + protectionCost;

  function formatCardNumber(v) {
    return v.replace(/\D/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
  }
  function formatExpiry(v) {
    const d = v.replace(/\D/g, "").slice(0, 4);
    return d.length >= 3 ? d.slice(0,2) + " / " + d.slice(2) : d;
  }
  function handleSaveCard() {
    if (cardForm.number.replace(/\s/g,"").length >= 15) {
      setSavedCard(cardForm);
      setShowCardModal(false);
    }
  }

  return (
    <div style={{ minHeight: "100vh", background: "#fff", fontFamily: "'DM Sans', 'Helvetica Neue', sans-serif" }}>
      <NavBar step={4} onLogoClick={onBack} />

      {showCardModal && (
        <div onClick={e => e.target === e.currentTarget && setShowCardModal(false)} style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 1000,
          display: "flex", alignItems: "center", justifyContent: "center", padding: 24,
        }}>
          <div style={{ background: "#fff", borderRadius: 20, padding: "36px 40px", width: 480, maxHeight: "90vh", overflowY: "auto", position: "relative" }}>
            <button onClick={() => setShowCardModal(false)} style={{ position: "absolute", top: 16, right: 20, background: "none", border: "none", fontSize: 22, cursor: "pointer", color: "#666" }}>✕</button>

            <h2 style={{ fontSize: 22, fontWeight: 800, textAlign: "center", margin: "0 0 28px" }}>Carte Bancaire</h2>

            {[["Titre (ex: Perso, Famille …)", "title"], ["Nom du titulaire de la carte", "name"]].map(([label, key]) => (
              <div key={key} style={{ marginBottom: 18 }}>
                <label style={{ fontSize: 13, color: "#444", fontWeight: 500, display: "block", marginBottom: 6 }}>{label}</label>
                <input value={cardForm[key]} onChange={e => setCardForm({...cardForm, [key]: e.target.value})}
                  style={{ width: "100%", border: "1.5px solid #e0e0e0", borderRadius: 10, padding: "12px 16px", fontSize: 14, outline: "none", boxSizing: "border-box" }} />
              </div>
            ))}

            <div style={{ border: "1.5px solid #e0e0e0", borderRadius: 10, padding: "16px", marginBottom: 18 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, paddingBottom: 14, marginBottom: 14, borderBottom: "1px solid #f0f0f0" }}>
                <span style={{ fontSize: 16 }}>🔒</span>
                <span style={{ fontSize: 13, color: "#444", fontWeight: 500 }}>Paiement rapide et sécurisé avec Link</span>
                <span style={{ fontSize: 12, color: "#888", marginLeft: "auto" }}>∨</span>
              </div>
              <label style={{ fontSize: 12, color: "#666", display: "block", marginBottom: 8 }}>Numéro de carte</label>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16, paddingBottom: 14, borderBottom: "1px solid #f5f5f5" }}>
                <input value={cardForm.number} onChange={e => setCardForm({...cardForm, number: formatCardNumber(e.target.value)})}
                  placeholder="1234 1234 1234 1234"
                  style={{ flex: 1, border: "none", outline: "none", fontSize: 14 }} />
                <div style={{ display: "flex", gap: 3 }}>
                  {[["#1a1de8","V"],["#eb001b","M"],["#2557D6","A"],["#003087","D"]].map(([bg,l]) => (
                    <div key={l} style={{ width: 30, height: 20, background: bg, borderRadius: 3, display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <span style={{ color: "#fff", fontSize: 9, fontWeight: 700 }}>{l}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ display: "flex", gap: 20 }}>
                <div style={{ flex: 1 }}>
                  <label style={{ fontSize: 12, color: "#666", display: "block", marginBottom: 6 }}>Date d'expiration</label>
                  <input value={cardForm.expiry} onChange={e => setCardForm({...cardForm, expiry: formatExpiry(e.target.value)})}
                    placeholder="MM / AA" style={{ width: "100%", border: "none", outline: "none", fontSize: 14 }} />
                </div>
                <div style={{ flex: 1 }}>
                  <label style={{ fontSize: 12, color: "#666", display: "block", marginBottom: 6 }}>Code de sécurité</label>
                  <div style={{ display: "flex", alignItems: "center" }}>
                    <input value={cardForm.cvc} onChange={e => setCardForm({...cardForm, cvc: e.target.value.replace(/\D/g,"").slice(0,3)})}
                      placeholder="CVC" style={{ flex: 1, border: "none", outline: "none", fontSize: 14 }} />
                    <span style={{ color: "#bbb", fontSize: 16 }}>💳</span>
                  </div>
                </div>
              </div>
            </div>

            <label style={{ fontSize: 13, color: "#444", fontWeight: 500, display: "block", marginBottom: 6 }}>Pays</label>
            <select value={cardForm.country} onChange={e => setCardForm({...cardForm, country: e.target.value})}
              style={{ width: "100%", border: "1.5px solid #e0e0e0", borderRadius: 10, padding: "12px 16px", fontSize: 14, outline: "none", marginBottom: 20, boxSizing: "border-box", background: "#fff" }}>
              {["France","Belgique","Suisse","Luxembourg","Espagne","Italie","Allemagne"].map(c => <option key={c}>{c}</option>)}
            </select>

            <p style={{ fontSize: 12, color: "#888", lineHeight: 1.5, marginBottom: 20 }}>
              En fournissant vos informations de carte bancaire, vous autorisez MobiTech à débiter votre carte pour les paiements futurs conformément à ses conditions.
            </p>

            <button onClick={handleSaveCard} style={{
              width: "100%", background: "#1a1a1a", color: "#fff", border: "none",
              borderRadius: 50, padding: "15px", fontSize: 15, fontWeight: 700, cursor: "pointer",
            }}>Valider</button>
          </div>
        </div>
      )}

      <div style={{ display: "flex" }}>
        <div style={{ flex: 1, padding: "40px 48px", maxWidth: 820 }}>
          <h1 style={{ fontSize: 32, fontWeight: 800, margin: "0 0 32px", letterSpacing: "-0.5px" }}>Paiement</h1>

          <div style={{ marginBottom: 24 }}>
            <div style={{ fontSize: 13, color: "#888", marginBottom: 10, fontWeight: 500 }}>Mode de paiement</div>
            <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
              <button onClick={() => setShowCardModal(true)} style={{ background: "none", border: "1.5px solid #1a1a1a", borderRadius: 50, padding: "7px 18px", fontSize: 13, cursor: "pointer", fontWeight: 600 }}>
                + Ajouter un moyen de paiement
              </button>
            </div>
            {savedCard ? (
              <div style={{ border: "1.5px solid #1a1a1a", borderRadius: 12, padding: "14px 20px", display: "flex", alignItems: "center", gap: 12 }}>
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#1a1a1a" strokeWidth={1.5}>
                  <rect x="2" y="5" width="20" height="14" rx="3"/>
                  <path d="M2 10h20" strokeLinecap="round"/>
                </svg>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600 }}>{savedCard.title || "Ma carte"} — {savedCard.name}</div>
                  <div style={{ fontSize: 12, color: "#888" }}>•••• •••• •••• {savedCard.number.replace(/\s/g,"").slice(-4)}</div>
                </div>
                <button onClick={() => setShowCardModal(true)} style={{ marginLeft: "auto", background: "none", border: "none", fontSize: 12, color: "#888", cursor: "pointer", textDecoration: "underline" }}>Modifier</button>
              </div>
            ) : (
              <div style={{ border: "1.5px solid #ebebeb", borderRadius: 12, padding: "16px 20px", display: "flex", alignItems: "center", gap: 10 }}>
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#ccc" strokeWidth={1.5}>
                  <rect x="2" y="5" width="20" height="14" rx="3"/>
                  <path d="M2 10h20" strokeLinecap="round"/>
                </svg>
                <span style={{ fontSize: 13, color: "#bbb" }}>Aucune carte enregistrée</span>
              </div>
            )}
          </div>

          <div style={{ marginBottom: 28 }}>
            <div style={{ fontSize: 13, color: "#888", marginBottom: 10, fontWeight: 500 }}>Code promo</div>
            {!showPromo ? (
              <button onClick={() => setShowPromo(true)} style={{ background: "none", border: "1.5px solid #1a1a1a", borderRadius: 50, padding: "8px 20px", fontSize: 13, cursor: "pointer", fontWeight: 600 }}>
                + Ajouter un code promo
              </button>
            ) : (
              <input value={promo} onChange={e => setPromo(e.target.value)} placeholder="Entrez votre code"
                style={{ border: "1.5px solid #ebebeb", borderRadius: 12, padding: "12px 18px", fontSize: 14, width: "100%", outline: "none", boxSizing: "border-box" }} />
            )}
          </div>

          <div style={{ display: "flex", alignItems: "flex-start", gap: 12, marginBottom: 24 }}>
            <div onClick={() => setAgreed(!agreed)} style={{
              width: 20, height: 20, borderRadius: 4, border: "1.5px solid #ccc", cursor: "pointer", flexShrink: 0,
              background: agreed ? "#1a1a1a" : "#fff", display: "flex", alignItems: "center", justifyContent: "center",
            }}>
              {agreed && <span style={{ color: "#fff", fontSize: 12, lineHeight: 1 }}>✓</span>}
            </div>
            <span style={{ fontSize: 13, color: "#444", lineHeight: 1.5 }}>
              J'ai lu et accepté les <a href="#" style={{ color: "#1a1a1a", fontWeight: 600 }}>Conditions générales de location</a>
            </span>
          </div>

          <button style={{
            width: "100%", background: agreed ? "#1a1a1a" : "#e0e0e0", color: agreed ? "#fff" : "#aaa",
            border: "none", borderRadius: 50, padding: "16px", fontSize: 15, fontWeight: 700,
            cursor: agreed ? "pointer" : "default", transition: "background 0.2s",
          }}>
            Réserver pour {total.toFixed(0)} € ({(total).toFixed(0)} €/j)
          </button>

          <p style={{ fontSize: 12, color: "#aaa", marginTop: 20, lineHeight: 1.6 }}>
            Je reconnais et accepte que virtuo conserve et utilise mes données de paiement pendant et après la durée de ma location, jusqu'à la prise en charge complète des charges éventuelles m'incombant.<br/>
            J'autorise virtuo à prélever, sur tous les moyens de paiement valides associés à mon compte, les frais encourus à ce titre.
          </p>
        </div>
        <BookingSidebar booking={booking} car={car} options={options} protection={protection} />
      </div>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────

export default function App() {
  const [page, setPage] = useState("home");
  const [booking, setBooking] = useState(null);
  const [selectedCar, setSelectedCar] = useState(null);
  const [selectedOptions, setSelectedOptions] = useState(null);
  const [selectedProtection, setSelectedProtection] = useState(undefined);

  function handleSearch(data) {
    setBooking(data);
    setPage("results");
  }

  if (page === "payment") {
    return <PaymentPage booking={booking} car={selectedCar} options={selectedOptions} protection={selectedProtection} onBack={() => setPage("protections")} />;
  }
  if (page === "protections") {
    return <ProtectionsPage booking={booking} car={selectedCar} options={selectedOptions} onBack={() => setPage("options")} onContinue={(p) => { setSelectedProtection(p); setPage("payment"); }} />;
  }
  if (page === "options") {
    return <OptionsPage booking={booking} car={selectedCar} onBack={() => setPage("cars")} onContinue={(opts) => { setSelectedOptions(opts); setPage("protections"); }} />;
  }
  if (page === "cars" && booking) {
    return <CarsPage booking={booking} onBack={() => setPage("results")} onSelectCar={(car) => { setSelectedCar(car); setPage("options"); }} />;
  }
  if (page === "results" && booking) {
    return <ResultsPage booking={booking} onEdit={() => setPage("home")} onDelivery={() => setPage("cars")} />;
  }

  // Home: just the search bar, centered
  return (
    <div style={{
      minHeight: "100vh",
      background: "#111",
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      padding: "24px",
      fontFamily: "'DM Sans', 'Helvetica Neue', sans-serif",
    }}>
      <div style={{ width: "100%", maxWidth: 920 }}>
        <SearchBar onSearch={handleSearch} />
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
